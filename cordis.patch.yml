# think_better — the 纯对话 (pure chat) agent preset plus the keep_thinking tool.
#
# Placement: the tool row sits INSIDE the preset and is named by an absolute file
# URL, not by the package name. Measured, not assumed:
#
# - A bare `think_better` there reported "never started": a preset's rows mount
#   into a registry-owned in-memory Loader subtree rather than the profile layer.
# - A throwaway probe preset then mounted a module by absolute file URL and
#   reported APPLIED, so that path is verified. Its baseUrl read back as
#   `file:///…/profiles/<name>/` — the profile directory — which `routeLocalPackage`
#   reads as `layer.kind === 'profile'`, i.e. by that rule a bare name *should*
#   resolve. The original failure therefore has no confirmed cause; treat the
#   bare name as untested and the file URL as the supported path.
# - `compatibility-preflight.ts` names the file case explicitly
#   (`!specifier.startsWith('file:')`), so such a row is admitted normally.
#
# The payoff is scope, not only resolution: a row mounted here registers through
# the preset's own context, so keep_thinking is visible to 纯对话 agents alone
# and no other mode has to be masked back.
#
# The Web app disables the base rows for tool-web, tool-fs and tool-fs-search
# ("The Web app disables this host row and composes both tools per agent
# preset"), so the preset must mount them itself.

- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        name: 纯对话
        description: 像网页版一样聊天，可联网搜索、读本地文件，需要时会多轮思考。
        order: 0
        plugins:
          # keep_thinking: text-only control flow for multi-round reasoning. Named
          # by absolute file URL, so it mounts here — scoped to this preset — and
          # never registers at the profile level.
          - id: think-better-tool
            name: 'file:///E:/DeepSeekHarness_own_plugin/think_better/lib/index.js'
            config:
              maxRounds: 10

          # Persona. A scoped `prefix` shadows deployment:persona-prefix, so the
          # deployment coding-agent identity is replaced without `complete: true`
          # -- and leaving `complete` unset keeps tool-guidance sections alive.
          # The suffix keeps {{cwd}} visible: no runtime-context provider supplies
          # the working directory, yet the fs tools resolve relative paths
          # against it.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是一位专业、耐心的对话助手，既能深入讨论专业问题，也能自然闲聊。
                专业问题上：结论先行、依据清楚、不确定处直言不讳。
                日常对话上：自然、简洁、不端着。
                需要查证时使用联网搜索或文件工具，不做无意义的工具调用；简单问题直接回答。
                推演不充分时调用 keep_thinking 继续思考，足够时立即作答。
              suffix: '当前工作目录是 {{cwd}}。'
              includeRuntimeContext: true

          # Web search: the one real capability the DeepSeek web app exposes.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # Ask instead of guessing when the user owns the decision.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # Local files: read what the user has, rather than waiting for an upload.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # `sampleOverCapGlobResults` is required by this plugin's Config schema
          # (`z.boolean().required()`), so it cannot be omitted.
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # File cards for anything `write` produces.
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
